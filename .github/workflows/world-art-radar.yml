name: Refresh world art radar
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch attributed source links
        run: python3 scripts/world_art_radar.py
      - name: Commit refreshed radar data
        run: |
          git config user.name "atelier-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-art-radar.json
          git diff --cached --quiet || (git commit -m "Update world art radar source links" && git push)
