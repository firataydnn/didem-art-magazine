name: Refresh world art radar
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/world_art_radar.py'
      - 'scripts/editorial_agent.py'
      - 'scripts/kulis_watch.py'
      - 'tests/test_editorial_agent.py'
      - 'scripts/official_press_watch.py'
      - '.github/workflows/world-art-radar.yml'
concurrency:
  group: atelier-world-art-radar-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Editorial safety regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Fetch attributed source links
        run: python3 scripts/world_art_radar.py
      - name: Check primary institutional press sources
        run: python3 scripts/official_press_watch.py
      - name: Rank stories and prepare editorial research briefs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATELIER_AI_MAX_ITEMS: '8'
        run: python3 scripts/editorial_agent.py
      - name: Stage unverified KULIS source leads
        run: python3 scripts/kulis_watch.py
      - name: Commit refreshed radar data
        run: |
          git config user.name "atelier-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-art-radar.json data/editorial-digest.json data/official-source-watch.json data/kulis-leads.json
          if git diff --cached --quiet; then
            echo "No source changes"; exit 0
          fi
          git commit -m "Update world art radar source links"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Radar data pushed successfully"; exit 0
            fi
            echo "Remote moved during push; retrying ($attempt/3)"
            sleep 2
          done
          echo "Unable to push radar data after retries" >&2
          exit 1
