name: Editorial data warehouse
on:
  workflow_run:
    workflows: ["Art news radar (editorial inbox)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pipeline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build editorial database
        run: python scripts/build_editorial_db.py "$RUNNER_TEMP/didem-art-editorial.sqlite"
      - name: Verify SQLite integrity
        run: python -c "import sqlite3,os; c=sqlite3.connect(os.environ['RUNNER_TEMP']+'/didem-art-editorial.sqlite'); assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'"
      - name: Export eligible stories to staging only
        run: python scripts/export_approved_stories.py "$RUNNER_TEMP/didem-art-editorial.sqlite" "$RUNNER_TEMP/approved-stories-staging.json"
      - name: Check staging launch threshold
        run: |
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/approved-stories-staging.json')); print('Approved, image-cleared articles:',d['count'],'/ 750 minimum'); print('Publication gate:', 'ELIGIBLE FOR EDITOR REVIEW' if d['count']>=750 else 'LOCKED')"
      - name: Upload private workflow snapshots (no site publication)
        uses: actions/upload-artifact@v4
        with:
          name: editorial-data-snapshot
          path: |
            ${{ runner.temp }}/didem-art-editorial.sqlite
            ${{ runner.temp }}/approved-stories-staging.json
          retention-days: 14
