name: Art news radar (editorial inbox)
on:
  schedule:
    - cron: '17 5,11,17 * * *' # UTC; Istanbul UTC+3

  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_supabase_radar.py'
permissions:
  contents: write
concurrency:
  group: art-news-radar
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test triage
        run: python -m unittest discover -s tests -v
      - name: Collect headlines (no publishing)
        run: python scripts/collect_art_news.py
      - name: Prioritize and flag duplicate headlines
        run: python scripts/triage_art_news.py
      - name: Sync research leads to Didem PostgreSQL
        env:
          DIDEM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DIDEM_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase_radar.py
      - name: Commit editorial inbox and triage if changed
        if: always() && !cancelled()
        run: |
          git add editorial/radar/inbox.json editorial/radar/triage.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(radar): update art editorial inbox and triage"
            git push
          fi
