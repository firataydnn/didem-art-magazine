name: Browser quality checks
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/images/**"
      - "tests/**"
      - ".github/workflows/browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/atelier-server.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run desktop and mobile browser tests
        run: node tests/browser-smoke.mjs
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
