<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Didem · Haber Masası Önizleme</title><style>body{margin:0;background:#f5f2eb;color:#29251f;font:16px system-ui}header,main{max-width:1100px;margin:auto;padding:28px}header{border-bottom:1px solid #d4ccc1}h1{font:normal 48px Georgia;margin:8px 0}small{letter-spacing:.12em;text-transform:uppercase}section{display:grid;gap:12px}article{background:white;border:1px solid #e1dcd3;padding:20px}article h2{font:normal 24px Georgia;margin:8px 0}article a{color:#503e32}input,select{padding:12px;border:1px solid #cfc7bc;background:white;font:inherit}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.meta{color:#746d65;font-size:13px}.warning{background:#eee1ce;padding:14px;margin-top:16px}button{padding:10px;cursor:pointer}@media(max-width:600px){h1{font-size:34px}}</style></head><body><header><small>Didem Art · Internal Editorial Research</small><h1>Haber Masası</h1><p>Kaynak tarama · öncelik · tekrar denetimi</p><div class="warning">Bu ekran yalnızca araştırma amaçlıdır. İçerikler doğrulanmamış olabilir; otomatik yayın ve görsel lisansı yoktur. Bu sayfa erişim kontrolü içermez; kişisel/özel veri koymayın.</div></header><main><nav><input id="search" placeholder="Haber ara"><select id="sort"><option value="priority">Öncelik</option><option value="recent">Tarih</option></select><label><input id="duplicates" type="checkbox"> Olası tekrarları göster</label></nav><p id="status">Haber havuzu yükleniyor…</p><section id="items"></section></main><script>
let records=[];
const el=id=>document.getElementById(id);
const safe=(s)=>String(s??"");
async function load(){try{const r=await fetch("./triage.json",{cache:"no-store"});if(!r.ok)throw Error("Triage dosyası henüz oluşmadı");const d=await r.json();records=d.items||[];render()}catch(e){el("status").textContent="Henüz haber verisi yok. GitHub Actions ilk başarılı çalışmasını bekliyor.";}}
function render(){const q=el("search").value.toLocaleLowerCase("tr");const dup=el("duplicates").checked;let a=records.filter(x=>(dup||!x.possible_duplicate_of)&&safe(x.title+" "+x.source).toLocaleLowerCase("tr").includes(q));if(el("sort").value==="recent")a.sort((x,y)=>safe(y.published).localeCompare(safe(x.published)));else a.sort((x,y)=>y.priority_score-x.priority_score);el("status").textContent=a.length+" kayıt · Hepsi editör kontrolü bekliyor";el("items").replaceChildren(...a.slice(0,200).map(x=>{const card=document.createElement("article");const h=document.createElement("h2");h.textContent=x.title;const m=document.createElement("p");m.className="meta";m.textContent=x.source+" · "+(x.published||"Tarih yok")+" · Öncelik "+x.priority_score+(x.possible_duplicate_of?" · OLASI TEKRAR":"");const link=document.createElement("a");link.textContent="Kaynağı aç ↗";link.href=x.url;link.target="_blank";link.rel="noopener noreferrer";card.append(h,m,link);return card}))}
["search","sort","duplicates"].forEach(id=>el(id).addEventListener("input",render));load();
</script></body></html>
